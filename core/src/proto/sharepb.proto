syntax = "proto3";

package gamepb.sharepb;

import "corepb.proto";

// ============ 分享服务 ============

// --- 检查是否可以分享 ---
message CheckCanShareRequest {}

message CheckCanShareReply {
    bool can_share = 1;  // 是否可以分享
}

// --- 报告分享 ---
message ReportShareRequest {
    int32 source = 1;
    bytes share_token = 2;  // 小程序分享回调携带的动态凭证；部分分享来源可为空
    int32 scene = 4;
}

message ReportShareReply {
    bytes result = 1;  // 分享回调的不透明结果；不同账号可能返回不同长度
}

// --- 领取分享奖励 ---
message ClaimShareRewardRequest {
    bool claimed = 1;  // 请求领取
}

message ClaimShareRewardReply {
    repeated corepb.Item items = 1;  // 奖励物品列表；失败由网关错误码返回
}
