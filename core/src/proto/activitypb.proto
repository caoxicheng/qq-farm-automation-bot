syntax = "proto3";

package gamepb.activitypb;

import "corepb.proto";

message ActivityContent {
    int64 activity_id = 1;
    int64 group_id = 2;
    int64 type = 3;
    string name = 4;
    bytes extra = 5;
    int64 begin_time = 6;
    int64 end_time = 7;
    int64 sort_order = 8;
    int64 field_20 = 20;
    int64 field_21 = 21;
    int64 field_22 = 22;
    int64 field_23 = 23;
}

message ActivityItem {
    int64 item_id = 1;
    int64 count = 2;
}

message StarSandGoods {
    int64 goods_id = 1;
    ActivityItem item = 2;
    ActivityItem cost = 3;
    int64 status = 4; // Previously decoded as field_4.
    bool owned = 5;
    int64 sort_order = 6;
    bytes name = 7;
    bytes resource_json = 8;
    int64 field_10 = 10;
    int64 field_11 = 11;
    bytes category = 12;
}

message StarSandGoodsList {
    repeated StarSandGoods goods = 1;
}

message ConstellationNode {
    int64 node_id = 1;
    bool field_2 = 2;
    bool field_3 = 3;
    bool field_4 = 4;
    repeated ActivityItem rewards = 5;
}

message ConstellationGroup {
    int64 group_id = 1;
    bool field_2 = 2;
    string name = 3;
    string links = 4;
    string config_json = 5;
}

message ConstellationData {
    int64 field_1 = 1;
    int64 field_2 = 2;
    int64 field_3 = 3;
    repeated ConstellationNode nodes = 4;
    repeated ConstellationGroup groups = 5;
}

message ActivityData {
    ActivityContent activity = 1;
    StarSandGoodsList catalog = 102;
    QingMeiDailySeedData qingmei_daily_seed = 103;
    QingMeiBrewData qingmei_brew = 108;
    ConstellationData constellation = 110;
    QingMeiBrewStarted qingmei_brew_started = 113;
    QingMeiQuote qingmei_quote = 114;
}

message ActivityWindow {
    int64 id = 1;
    string name = 2;
    int64 begin_time = 3;
    int64 end_time = 4;
}

message ActivityListRequest {}

message ActivityListReply {
    repeated ActivityData activities = 1;
    repeated ActivityWindow activity_windows = 2;
}

message QingMeiDailySeedGrant {
    int64 grant_id = 1;
    ActivityItem item = 3;
}

message QingMeiDailySeedData {
    bool claimed = 1;
    QingMeiDailySeedGrant grant = 2;
}

message QingMeiBrewData {
    int64 base_gold = 1;
    int64 current_round = 2;
    int64 max_rounds = 3;
    repeated int64 quote_prices = 4 [packed = true];
    repeated int64 quote_totals = 5 [packed = true];
    bool finished = 6;
    int64 base_price = 7;
    repeated int64 ingredient_item_ids = 8 [packed = true];
    int64 guaranteed_price = 9;
}

message QingMeiBrewStarted {
    int64 base_gold = 1;
}

message QingMeiQuote {
    int64 round = 1;
    int64 unit_price = 2;
    int64 total_gold = 3;
    bool doubled = 4;
}

message QingMeiSettlement {
    int64 settlement_mode = 1;  // 1=直接卖出，2=分享后结算
    int64 total_gold = 2;
    corepb.Item reward = 3;
}

// ActivityService.Operate selectors are fixed by the callers below. No generic
// operate_type is exposed by the HTTP API.
message QueryActivityRequest {
    int64 activity_id = 1;
    int64 operate_type = 2;
}

message ExchangeShopOperateParams {
    int64 goods_id = 1;
    int64 count = 2;
}

message ExchangeShopRequest {
    int64 activity_id = 1;
    int64 operate_type = 2;
    ExchangeShopOperateParams exchange_shop_operate = 101;
}

message OperateConstellationRequest {
    message Empty {}

    int64 activity_id = 1;
    int64 operate_type = 2;
    Empty field_119 = 119;
}

message ClaimQingMeiDailySeedRequest {
    message Params { int64 grant_id = 1; }
    int64 activity_id = 1;
    int64 operate_type = 2;
    Params params = 103;
}

message StartQingMeiBrewRequest {
    message Ingredient {
        int64 uid = 1;
        int64 count = 2;
    }
    message Params { repeated Ingredient ingredients = 1; }
    int64 activity_id = 1;
    int64 operate_type = 2;
    Params params = 112;
}

message ContinueQingMeiBrewRequest {
    message Empty {}
    int64 activity_id = 1;
    int64 operate_type = 2;
    Empty params = 113;
}

message SettleQingMeiBrewRequest {
    message Params { int64 settlement_mode = 1; }  // 1=直接卖出，2=分享后结算
    int64 activity_id = 1;
    int64 operate_type = 2;
    Params params = 114;
}

message ActivityOperateReply {
    int64 activity_id = 1;
    int64 operate_type = 2;
    ActivityData data = 3;
    repeated corepb.Item rewards = 104;
    QingMeiBrewStarted qingmei_brew_started = 113;
    QingMeiQuote qingmei_quote = 114;
    QingMeiSettlement qingmei_settlement = 115;
}

message ActiviesChangeNotify {
    repeated ActivityContent activities = 1;
}
