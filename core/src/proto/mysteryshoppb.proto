syntax = "proto3";

package gamepb.mysteryshoppb;

import "corepb.proto";

service MysteryShopService {
  rpc GetActiveNPC(GetActiveNPCRequest) returns (GetActiveNPCReply);
  rpc Buy(BuyRequest) returns (BuyReply);
}

message GetActiveNPCRequest {}

// 神秘商人限时商品。字段 3 的业务含义仍待更多样本确认；购买前后抓包确认字段 8 为已购买次数。
message ActiveNPC {
  int64 npc_id = 1;
  int64 reward_item_id = 2;
  int32 field_3 = 3;
  int32 reward_count = 4;
  int64 currency_item_id = 5;
  int64 unit_price = 6;
  int32 discount_percent = 7;
  int32 purchased_count = 8;
  int64 original_unit_price = 9;
}

message GetActiveNPCReply {
  bool is_active = 1;
  ActiveNPC npc = 2;
  int64 active_time = 3;
  int64 expire_time = 4;
}

message MysteryShopNotify {
  ActiveNPC npc = 1;
  int64 expire_time = 2;
}

// 购买一次当前商品；抓包确认请求只携带 npc_id。
message BuyRequest {
  int64 npc_id = 1;
}

message BuyReply {
  repeated corepb.Item rewards = 1;
  ActiveNPC npc = 2;
}
